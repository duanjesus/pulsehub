server:
  port: 8080

spring:
  application:
    name: pulsehub-api

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pulsehub_db}
    username: ${DB_USER:pulsehub_user}
    password: ${DB_PASSWORD:pulsehub_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

logging:
  level:
    com.pulsehub: INFO
    org.hibernate.SQL: WARN

jwt:
  secret: ${JWT_SECRET:cHVsc2VodWItYXBpLXN1cGVyLXNlY3JldC1rZXktY2hhbmdlLWluLXByb2R1Y3Rpb24=}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

pulsehub:
  presence:
    away-after-minutes: 5
  uploads:
    dir: ${UPLOADS_DIR:uploads}
