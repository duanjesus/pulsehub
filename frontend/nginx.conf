# This nginx is also the load balancer in front of the API replicas.

# Docker's embedded DNS. `api` resolves to one address per replica; re-resolving it
# (the `resolve` flag below) is what lets replicas be added, removed or replaced
# without reloading nginx.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream pulsehub_api {
    zone pulsehub_api 64k;
    server api:8080 resolve;
}

# A SockJS session is /ws/<server>/<session>/<transport>. Its fallback transports
# are several HTTP requests that must all reach the replica holding the session, so
# requests are hashed on the session id: sticky per session, spread across sessions.
map $uri $sockjs_session {
    "~^/ws/[^/]+/(?<sid>[^/]+)/" $sid;
    default                      $request_id;
}

# Plain `hash`, not `hash ... consistent`: the consistent variant keys its ring on the
# server *name*, so the several addresses behind `api` count as one server and are
# simply round-robined, which is not sticky at all.
upstream pulsehub_ws {
    zone pulsehub_ws 64k;
    hash $sockjs_session;
    server api:8080 resolve;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# The SPA, with the API under the same origin.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://pulsehub_api;
    }

    location /ws/ {
        proxy_pass http://pulsehub_ws;
    }

    location /uploads/ {
        proxy_pass http://pulsehub_api;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# The API on its own port (Swagger UI, curl, other services), balanced the same way.
server {
    listen 8080;
    server_name _;

    location /ws/ {
        proxy_pass http://pulsehub_ws;
    }

    location / {
        proxy_pass http://pulsehub_api;
    }
}
