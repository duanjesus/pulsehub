server:
  port: 8080

spring:
  application:
    name: pulsehub-api

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pulsehub_db}
    username: ${DB_USER:pulsehub_user}
    password: ${DB_PASSWORD:pulsehub_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Bounds how long a send blocks before falling back to local-only delivery when Redis is down.
      timeout: 2s
      connect-timeout: 2s
      repositories:
        enabled: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

logging:
  level:
    com.pulsehub: INFO
    org.hibernate.SQL: WARN

jwt:
  secret: ${JWT_SECRET:cHVsc2VodWItYXBpLXN1cGVyLXNlY3JldC1rZXktY2hhbmdlLWluLXByb2R1Y3Rpb24=}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

pulsehub:
  # Inside Docker HOSTNAME is the container id, which is unique per replica.
  instance-id: ${HOSTNAME:local}
  security:
    system-api-key: ${SYSTEM_API_KEY:pulsehub-system-dev-key-change-me}
  presence:
    away-after-minutes: 5
  uploads:
    dir: ${UPLOADS_DIR:uploads}
  call:
    # STUN only finds a direct path; peers behind strict NATs also need a TURN
    # entry (urls + username + credential). An env-defined list replaces this
    # one rather than merging, so start at PULSEHUB_CALL_ICESERVERS_0_URLS.
    ice-servers:
      - urls: stun:stun.l.google.com:19302
  push:
    vapid:
      public-key: ${VAPID_PUBLIC_KEY:BMg3hYcacW5e9wrbc5WtpmRvyUV8sxko3codZH9mry3xf_LXr0CV7Ndl8t2e8GkJ4h6obuzY40OMxRfSC7X8q7U}
      private-key: ${VAPID_PRIVATE_KEY:h5BB_SqCWe_frfGuMlqOzMRyqiyjwNFS2MoiJJbF-Ms}
      subject: ${VAPID_SUBJECT:mailto:duanjesus30@gmail.com}
